name: Collect GTA 6 images

on:
  schedule:
    - cron: "30 22 * * *"   # 04:00 IST daily, before the 05:00 IST posting task
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect
        run: python collect.py

      - name: Commit new images
        run: |
          git config user.name "leonida-logs-bot"
          git config user.email "leonida-logs-bot@users.noreply.github.com"
          git add official manifest.json
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Add GTA 6 images $(date -u +%Y-%m-%d)"
            git push
          fi
